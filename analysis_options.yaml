include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Flutter 3.50 marks package:flutter/material.dart as deprecated in favour
    # of a separate `material_ui` package that is not bundled with the SDK.
    # The course brief requires standard Material widgets, so we stay on the
    # bundled API and silence only that SDK-level notice.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
